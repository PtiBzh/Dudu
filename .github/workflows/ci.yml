name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          python --version
          python -c "import django; print('Django', django.get_version())"

      - name: Cohérence des migrations
        id: coherence
        run: python manage.py makemigrations --check --dry-run
        continue-on-error: true

      - name: Migrations
        run: python manage.py migrate

      - name: Tests
        run: python manage.py test

      - name: Diagnostic — commiter les migrations manquantes
        if: steps.coherence.outcome == 'failure'
        run: |
          set +e
          exec > "Diagnostic CI.txt" 2>&1
          python manage.py makemigrations core --no-input --verbosity 3
          echo "exit=$?"
          ls -la core/migrations/
          git config user.name "CI Dudu"
          git config user.email "actions@github.com"
          git add "Diagnostic CI.txt" core/migrations/
          git commit -m "ci: incohérence des migrations — diagnostic (temporaire)"
          git push || echo "rien à pousser"
          exit 1

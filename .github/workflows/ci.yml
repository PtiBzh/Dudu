name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques vendored (MapLibre GL JS)
        run: |
          cd static/vendor
          if [ ! -f maplibre-gl.js ]; then
            curl -fsSL -o maplibre-gl.js "https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.js"
          fi
          if [ ! -f maplibre-gl.css ]; then
            curl -fsSL -o maplibre-gl.css "https://unpkg.com/maplibre-gl@5.24.1/dist/maplibre-gl.css"
          fi
          sha256sum -c <<'SOMMES'
          a9c9e2aa36d4d5b63b131f27c1272f1a28883eeecc0eddd1e0dbfae4033bc7c9  maplibre-gl.js
          ab1e70d59ec40465bae7e7030da2f3ccf28133fd502e62bd598eefbadfd7a732  maplibre-gl.css
          SOMMES

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          python -c "import django; print('Django', django.get_version())"

      - name: Migrations manquantes (générées automatiquement)
        id: makemig
        run: |
          set +e
          python manage.py makemigrations --no-input > "Diagnostic CI.txt" 2>&1
          code=$?
          cat "Diagnostic CI.txt"
          exit $code

      - name: Migrer
        id: migrer
        run: |
          set +e
          python manage.py migrate > "Diagnostic CI.txt" 2>&1
          code=$?
          cat "Diagnostic CI.txt"
          exit $code

      - name: Tests
        id: tests
        run: |
          set +e
          python manage.py test > "Diagnostic CI.txt" 2>&1
          code=$?
          cat "Diagnostic CI.txt"
          exit $code

      - name: Synchroniser le dépôt
        if: always()
        run: |
          git config user.name "CI Dudu"
          git config user.email "actions@github.com"
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            rm -f "Diagnostic CI.txt"
          fi
          git add -A
          if git diff --quiet --cached; then
            echo "rien à synchroniser"
          else
            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              git commit -m "ci: migrations et bibliothèques vendored synchronisées, validées par les tests"
            else
              git commit -m "ci: échec — diagnostic et migrations générées"
            fi
            git push
          fi

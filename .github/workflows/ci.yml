name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: |
          pip install -r requirements.txt
          python --version
          python -c "import django; print('Django', django.get_version())"

      - name: Diagnostic complet
        run: |
          set +e
          exec > "Diagnostic CI.txt" 2>&1
          echo "=== makemigrations --check --dry-run ==="
          python manage.py makemigrations --check --dry-run --verbosity 3
          echo "exit=$?"
          echo
          echo "=== makemigrations core --verbosity 3 ==="
          python manage.py makemigrations core --verbosity 3
          echo "exit=$?"
          echo
          echo "=== migrate ==="
          python manage.py migrate
          echo "exit=$?"
          echo
          echo "=== test ==="
          python manage.py test
          echo "exit=$?"
          echo
          echo "=== état du dossier migrations ==="
          ls -la core/migrations/

      - name: Publier le diagnostic
        if: always()
        run: |
          git config user.name "CI Dudu"
          git config user.email "actions@github.com"
          git add "Diagnostic CI.txt" core/migrations/
          git commit -m "ci: diagnostic complet (temporaire)" || echo "rien à commiter"
          git push || echo "rien à pousser"

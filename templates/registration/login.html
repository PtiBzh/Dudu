{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<section class="boite">
  <h1>Connexion</h1>
  <p class="apercu">Identifie-toi : sur Dudu, rien n'est anonyme.</p>
  {% if form.non_field_errors %}
    <p class="erreur">{{ form.non_field_errors.0 }}</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <p>
      <label for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
      {{ form.username }}
    </p>
    <p>
      <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
      {{ form.password }}
    </p>
    <button type="submit">Se connecter</button>
  </form>
</section>
{% endblock %}
